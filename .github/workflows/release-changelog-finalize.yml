name: Release changelog finalize

on:
  push:
    branches:
      - chore/release-v1.6.0

permissions:
  contents: write

jobs:
  finalize-changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize v1.6.0 changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("CHANGELOG.md")
          text = p.read_text()
          heading_old = "## [Unreleased]\n\n### Changed"
          heading_new = "## [Unreleased]\n\n## [1.6.0] - 2026-09-17\n\n### Changed"
          if heading_old not in text:
              raise SystemExit("expected Unreleased heading not found")
          text = text.replace(heading_old, heading_new, 1)
          link_old = "[Unreleased]: https://github.com/levi-qiao/herdr-agent-quota/compare/v1.5.5...HEAD"
          link_new = "[Unreleased]: https://github.com/levi-qiao/herdr-agent-quota/compare/v1.6.0...HEAD\n[1.6.0]: https://github.com/levi-qiao/herdr-agent-quota/compare/v1.5.5...v1.6.0"
          if link_old not in text:
              raise SystemExit("expected Unreleased compare link not found")
          text = text.replace(link_old, link_new, 1)
          p.write_text(text)
          PY
      - name: Commit changelog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: finalize changelog for v1.6.0"
          git push
